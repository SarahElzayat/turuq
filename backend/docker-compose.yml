services:
  api:
    build: .
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/turuq-users
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      SEED_API_KEY: ${SEED_API_KEY:-change-this-seed-key}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
